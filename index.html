<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mind-ассистент | Осознанная продуктивность</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* ===== СТИЛЬ "ДУМИ" – МИНИМАЛИЗМ, ВОЗДУХ, КУРСИВЫ ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #FFFFFF;
  color: #1A2C3E;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ===== ОБЩИЕ КОМПОНЕНТЫ ===== */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
}

.screen {
  min-height: 100dvh;
}

.hidden {
  display: none !important;
}

/* ===== АВТОРИЗАЦИЯ ===== */
.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
  padding: 24px;
}

.auth-card {
  max-width: 420px;
  width: 100%;
  text-align: center;
}

.auth-logo {
  font-size: 64px;
  margin-bottom: 24px;
}

.auth-card h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  font-style: italic;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: #1A2C3E;
  margin-bottom: 12px;
}

.auth-card > p {
  color: #6C7E8F;
  font-size: 15px;
  margin-bottom: 40px;
}

.auth-tabs {
  display: flex;
  gap: 12px;
  background: #F5F7FA;
  padding: 4px;
  border-radius: 60px;
  margin-bottom: 32px;
}

.auth-tab {
  flex: 1;
  padding: 12px;
  border: none;
  background: transparent;
  border-radius: 40px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.auth-tab.active {
  background: #FFFFFF;
  color: #1A2C3E;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.auth-form {
  display: none;
  flex-direction: column;
  gap: 16px;
}

.auth-form.active {
  display: flex;
}

.auth-form input {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid #E2E8F0;
  border-radius: 12px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  background: #FFFFFF;
  transition: all 0.2s;
}

.auth-form input:focus {
  outline: none;
  border-color: #4CAF50;
  box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
}

.auth-form button {
  width: 100%;
  padding: 14px;
  background: #1A2C3E;
  color: white;
  font-weight: 600;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.2s;
}

.auth-form button:hover {
  background: #2C3E50;
  transform: translateY(-1px);
}

.auth-error {
  font-size: 12px;
  color: #FF6B6B;
  margin-top: 4px;
}

/* ===== НАСТРОЙКИ ===== */
.setup-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #FFFFFF;
  padding: 24px;
}

.setup-card {
  max-width: 420px;
  width: 100%;
  text-align: center;
}

.setup-icon {
  font-size: 48px;
  margin-bottom: 20px;
}

.setup-card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 34px;
  font-style: italic;
  font-weight: 600;
  margin-bottom: 12px;
}

.setup-card > p {
  color: #6C7E8F;
  font-size: 14px;
  margin-bottom: 32px;
}

.setup-card .time-label {
  display: block;
  text-align: left;
  font-size: 13px;
  font-weight: 500;
  margin: 20px 0 8px;
  color: #6C7E8F;
}

.setup-card input {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid #E2E8F0;
  border-radius: 12px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  background: #FFFFFF;
}

.setup-card input:focus {
  outline: none;
  border-color: #4CAF50;
}

.setup-card button {
  width: 100%;
  padding: 14px;
  margin-top: 32px;
  background: #1A2C3E;
  color: white;
  border: none;
  border-radius: 40px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.setup-card button:hover {
  background: #2C3E50;
}

/* ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== */
.main-app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

/* Верхняя плашка с прогрессом */
.top-bar {
  background: #F5F7FA;
  border-bottom: 1px solid #E2E8F0;
  padding: 16px 0;
  position: sticky;
  top: 0;
  z-index: 10;
}

.top-bar .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-mini {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-style: italic;
  font-weight: 700;
  color: #1A2C3E;
}

.progress-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-top-text {
  font-size: 12px;
  font-weight: 500;
  color: #6C7E8F;
}

.progress-top-bar {
  width: 120px;
  height: 4px;
  background: #E2E8F0;
  border-radius: 4px;
  overflow: hidden;
}

.progress-top-fill {
  height: 100%;
  background: #4CAF50;
  width: 0%;
  transition: width 0.3s;
}

.user-top {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-name-top {
  font-size: 14px;
  font-weight: 500;
  color: #1A2C3E;
}

.logout-top {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #6C7E8F;
}

/* Основной контент */
.main-content {
  flex: 1;
  padding: 48px 0;
}

/* Заголовки как на "Думах" */
.page-header {
  text-align: center;
  margin-bottom: 48px;
}

.page-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  font-style: italic;
  font-weight: 600;
  letter-spacing: -1px;
  color: #1A2C3E;
  margin-bottom: 12px;
}

.greeting {
  font-size: 16px;
  color: #6C7E8F;
}

/* Сетка как в портфолио */
.tasks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
  margin-bottom: 40px;
}

.task-card {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 24px;
  padding: 24px;
  transition: all 0.25s ease;
  cursor: pointer;
}

.task-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 24px -12px rgba(0,0,0,0.15);
  border-color: #4CAF50;
}

.task-card.completed {
  background: #F5F9F5;
  border-color: #4CAF50;
}

.task-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.task-check {
  width: 22px;
  height: 22px;
  accent-color: #4CAF50;
  cursor: pointer;
}

.task-title {
  flex: 1;
  font-size: 16px;
  font-weight: 500;
}

.completed .task-title {
  text-decoration: line-through;
  color: #9E9E9E;
}

.delete-task-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #E2E8F0;
  transition: color 0.2s;
}

.delete-task-btn:hover {
  color: #FF6B6B;
}

.task-reward-input {
  width: 100%;
  margin-top: 16px;
  padding: 12px 16px;
  border: 1px solid #E2E8F0;
  border-radius: 16px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}

.task-reward-input:focus {
  outline: none;
  border-color: #4CAF50;
}

.task-reward-input.has-value {
  background: #F5F9F5;
  border-color: #4CAF50;
}

.add-task-card {
  background: #F5F7FA;
  border-radius: 24px;
  padding: 24px;
  margin-top: 24px;
}

.add-task-form {
  display: flex;
  gap: 12px;
}

.add-task-form input {
  flex: 1;
  padding: 14px 18px;
  border: 1px solid #E2E8F0;
  border-radius: 40px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: #FFFFFF;
}

.add-task-form button {
  padding: 14px 28px;
  background: #1A2C3E;
  color: white;
  border: none;
  border-radius: 40px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.add-task-form button:hover {
  background: #2C3E50;
}

.task-limit-note {
  text-align: center;
  font-size: 12px;
  margin-top: 24px;
  color: #6C7E8F;
}

/* Статистика */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: #F5F7FA;
  border-radius: 20px;
  padding: 24px 16px;
  text-align: center;
}

.stat-number {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  font-weight: 700;
  color: #1A2C3E;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 12px;
  color: #6C7E8F;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Награды */
.rewards-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.reward-item {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 20px;
  padding: 20px;
  transition: all 0.2s;
}

.reward-item.claimed {
  background: #F5F9F5;
  border-color: #4CAF50;
}

.reward-task-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}

.reward-status-badge {
  display: inline-block;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 12px;
}

.badge-done {
  background: #E8F5E9;
  color: #4CAF50;
}

.badge-pending {
  background: #FFF3E0;
  color: #FF9800;
}

.reward-value {
  background: #F5F7FA;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 14px;
}

.reward-claim-label {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-size: 14px;
}

.reward-claim-check {
  width: 18px;
  height: 18px;
  accent-color: #4CAF50;
}

/* Отдых */
.rest-card {
  background: #F5F7FA;
  border-radius: 32px;
  padding: 48px 32px;
  text-align: center;
}

.rest-quote {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-style: italic;
  color: #1A2C3E;
  margin-bottom: 24px;
}

/* Пустое состояние */
.empty-state {
  text-align: center;
  padding: 48px;
  background: #F5F7FA;
  border-radius: 24px;
}

.empty-emoji {
  font-size: 64px;
  margin-bottom: 16px;
  display: block;
}

/* ===== НИЖНЯЯ НАВИГАЦИЯ (НА МОБИЛЬНЫХ ВСЕГДА ВИДНА, БЕЗ ПЛАШКИ) ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #FFFFFF;
  border-top: 1px solid #E2E8F0;
  padding: 12px 24px 24px;
  display: flex;
  justify-content: space-around;
  z-index: 20;
}

.bottom-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: #6C7E8F;
  cursor: pointer;
  transition: all 0.2s;
  padding: 8px 16px;
  border-radius: 40px;
}

.bottom-nav-btn .nav-icon {
  font-size: 22px;
}

.bottom-nav-btn.active {
  color: #4CAF50;
  background: #E8F5E9;
}

/* Уведомления */
.notification-prompt {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 90%;
  max-width: 360px;
}

.notification-card {
  background: #1A2C3E;
  color: white;
  border-radius: 20px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.notification-card p {
  font-size: 13px;
  flex: 1;
}

.notification-card button {
  padding: 8px 16px;
  border-radius: 30px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

#allowNotificationsBtn {
  background: #4CAF50;
  color: white;
}

#denyNotificationsBtn {
  background: transparent;
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}

/* Адаптивность */
@media (min-width: 769px) {
  .bottom-nav {
    display: none;
  }
}

@media (max-width: 768px) {
  .page-header h2 {
    font-size: 36px;
  }
  
  .tasks-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  
  .rewards-list {
    grid-template-columns: 1fr;
  }
  
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  
  .add-task-form {
    flex-direction: column;
  }
  
  .rest-quote {
    font-size: 22px;
  }
  
  .main-content {
    padding: 32px 0 100px;
  }
  
  .top-bar .user-name-top,
  .top-bar .logout-top {
    display: none;
  }
}

@media (min-width: 769px) {
  .main-content {
    padding: 48px 0;
  }
}
</style>
</head>
<body>

<div id="app">
  <!-- ЭКРАН ВХОДА -->
  <div id="authScreen" class="screen auth-screen">
    <div class="auth-card">
      <div class="auth-logo">🧠</div>
      <h1>Mind-ассистент</h1>
      <p>Осознанная продуктивность</p>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
      </div>
      <div id="loginForm" class="auth-form active">
        <input type="text" id="loginUsername" placeholder="Логин">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <button id="doLoginBtn">Войти</button>
        <div class="auth-error" id="loginError"></div>
      </div>
      <div id="registerForm" class="auth-form">
        <input type="text" id="regUsername" placeholder="Логин">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Пароль">
        <button id="doRegisterBtn">Зарегистрироваться</button>
        <div class="auth-error" id="regError"></div>
      </div>
    </div>
  </div>

  <!-- НАСТРОЙКА ИМЕНИ -->
  <div id="nameSetupScreen" class="screen setup-screen hidden">
    <div class="setup-card">
      <div class="setup-icon">👋</div>
      <h2>Как к вам обращаться?</h2>
      <p>Введите ваше имя — будем использовать в приложении</p>
      <input type="text" id="userNameInput" placeholder="Например: Алеся">
      <button id="saveNameBtn">Продолжить →</button>
    </div>
  </div>

  <!-- НАСТРОЙКА УВЕДОМЛЕНИЙ -->
  <div id="notificationsSetupScreen" class="screen setup-screen hidden">
    <div class="setup-card">
      <div class="setup-icon">🔔</div>
      <h2>Настройка напоминаний</h2>
      <p>Когда напоминать о задачах?</p>
      <div class="time-label">Утреннее напоминание</div>
      <input type="time" id="morningTime" value="09:00">
      <div class="time-label">Вечернее напоминание</div>
      <input type="time" id="eveningTime" value="20:00">
      <button id="saveNotificationsBtn">Сохранить и начать →</button>
    </div>
  </div>

  <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="mainApp" class="main-app hidden">
    <!-- Верхняя плашка с прогрессом -->
    <div class="top-bar">
      <div class="container">
        <div class="logo-mini">Mind-ассистент</div>
        <div class="progress-top">
          <span class="progress-top-text">Прогресс дня</span>
          <div class="progress-top-bar">
            <div class="progress-top-fill" id="topProgressFill"></div>
          </div>
          <span class="progress-top-text" id="topPercent">0%</span>
        </div>
        <div class="user-top">
          <span class="user-name-top" id="topUserName"></span>
          <button class="logout-top" id="topLogoutBtn">🚪</button>
        </div>
      </div>
    </div>

    <!-- Основной контент -->
    <main class="main-content" id="mainContent"></main>

    <!-- Нижняя навигация (всегда видна на мобильных, без гамбургера) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="bottom-nav-btn active" data-page="planner"><span class="nav-icon">📋</span> Планер</button>
      <button class="bottom-nav-btn" data-page="progress"><span class="nav-icon">📊</span> Прогресс</button>
      <button class="bottom-nav-btn" data-page="rewards"><span class="nav-icon">🏆</span> Награды</button>
      <button class="bottom-nav-btn" data-page="rest"><span class="nav-icon">🌿</span> Отдых</button>
    </nav>
  </div>
</div>

<!-- ЗАПРОС УВЕДОМЛЕНИЙ -->
<div id="notificationPermission" class="notification-prompt hidden">
  <div class="notification-card">
    <p>🔔 Получать напоминания?</p>
    <button id="allowNotificationsBtn">Да</button>
    <button id="denyNotificationsBtn">Нет</button>
  </div>
</div>

<script>
// ------------------------------------------------------------
// 1. ХРАНИЛИЩЕ ПОЛЬЗОВАТЕЛЕЙ
// ------------------------------------------------------------
let users = JSON.parse(localStorage.getItem('mind_users')) || [];
let currentUser = JSON.parse(localStorage.getItem('mind_currentUser')) || null;

function saveUsers() { localStorage.setItem('mind_users', JSON.stringify(users)); }
function saveCurrentUser() {
  localStorage.setItem('mind_currentUser', JSON.stringify(currentUser));
  const idx = users.findIndex(u => u.id === currentUser.id);
  if (idx !== -1) { users[idx] = currentUser; saveUsers(); }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ------------------------------------------------------------
// 2. АВТОРИЗАЦИЯ
// ------------------------------------------------------------
function setupAuthTabs() {
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.tab;
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById(name + 'Form').classList.add('active');
    });
  });
}

function register(username, email, password) {
  if (users.find(u => u.username === username)) {
    document.getElementById('regError').textContent = 'Пользователь уже существует';
    return false;
  }
  users.push({
    id: Date.now(), username, email, password,
    name: '', isProfileSetup: false,
    notificationTimeMorning: '09:00', notificationTimeEvening: '20:00',
    tasks: [], claimedRewards: []
  });
  saveUsers();
  return true;
}

function login(username, password) {
  const user = users.find(u => u.username === username && u.password === password);
  if (!user) {
    document.getElementById('loginError').textContent = 'Неверный логин или пароль';
    return false;
  }
  currentUser = user;
  saveCurrentUser();
  return true;
}

function afterLogin() {
  if (!currentUser.name) showScreen('nameSetupScreen');
  else if (!currentUser.isProfileSetup) showScreen('notificationsSetupScreen');
  else startMainApp();
}

function saveUserName(name) { currentUser.name = name; saveCurrentUser(); }
function saveNotificationTimes(morning, evening) {
  currentUser.notificationTimeMorning = morning;
  currentUser.notificationTimeEvening = evening;
  currentUser.isProfileSetup = true;
  saveCurrentUser();
  scheduleNotifications();
  startMainApp();
}

// ------------------------------------------------------------
// 3. УВЕДОМЛЕНИЯ
// ------------------------------------------------------------
function requestNotifications() {
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') scheduleNotifications();
    document.getElementById('notificationPermission').classList.add('hidden');
  });
}

function scheduleNotifications() {
  if (!currentUser || Notification.permission !== 'granted') return;
  function scheduleAt(time, title, body) {
    const now = new Date();
    let [h, m] = time.split(':').map(Number);
    let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
    if (target <= now) target.setDate(target.getDate() + 1);
    setTimeout(() => { if (Notification.permission === 'granted') new Notification(title, { body }); }, target - now);
  }
  scheduleAt(currentUser.notificationTimeMorning, 'Доброе утро!', `${currentUser.name}, выбери три фокус-задачи на день.`);
  scheduleAt(currentUser.notificationTimeEvening, 'Время отдохнуть!', `${currentUser.name}, ты отлично поработала. Награди себя и отдохни.`);
}

// ------------------------------------------------------------
// 4. ЛОГИКА ЗАДАЧ
// ------------------------------------------------------------
const MAX_TASKS = 3;

function addTask(title) {
  if (!title.trim()) return;
  if (currentUser.tasks.length >= MAX_TASKS) { alert(`Максимум ${MAX_TASKS} задачи в день. Сфокусируйся на главном!`); return; }
  currentUser.tasks.push({ id: Date.now(), title: title.trim(), completed: false, reward: '' });
  saveCurrentUser();
  renderCurrentPage();
}

function toggleTask(id) {
  let t = currentUser.tasks.find(t => t.id === id);
  if (t) { t.completed = !t.completed; saveCurrentUser(); renderCurrentPage(); }
}

function updateTaskReward(id, val) {
  let t = currentUser.tasks.find(t => t.id === id);
  if (t) { t.reward = val; saveCurrentUser(); }
}

function deleteTask(id) {
  if (!confirm('Удалить задачу?')) return;
  currentUser.tasks = currentUser.tasks.filter(t => t.id !== id);
  currentUser.claimedRewards = (currentUser.claimedRewards || []).filter(r => r !== id);
  saveCurrentUser();
  renderCurrentPage();
}

function toggleRewardClaim(id) {
  let t = currentUser.tasks.find(t => t.id === id);
  if (!t || !t.reward?.trim()) { alert('Сначала пропишите награду в разделе «Планер»'); return; }
  if (!currentUser.claimedRewards) currentUser.claimedRewards = [];
  if (currentUser.claimedRewards.includes(id)) {
    currentUser.claimedRewards = currentUser.claimedRewards.filter(r => r !== id);
  } else {
    currentUser.claimedRewards.push(id);
    alert(`Поздравляю! Ты забрала награду: ${t.reward}`);
  }
  saveCurrentUser();
  renderCurrentPage();
}

function escapeHtml(s) { let d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ------------------------------------------------------------
// 5. РЕНДЕР СТРАНИЦ
// ------------------------------------------------------------
function updateTopBar() {
  if (!currentUser) return;
  const total = currentUser.tasks.length;
  const completed = currentUser.tasks.filter(t => t.completed).length;
  const percent = total ? Math.round(completed / total * 100) : 0;
  const topFill = document.getElementById('topProgressFill');
  const topPercent = document.getElementById('topPercent');
  const topUserName = document.getElementById('topUserName');
  if (topFill) topFill.style.width = percent + '%';
  if (topPercent) topPercent.textContent = percent + '%';
  if (topUserName) topUserName.textContent = currentUser.name || currentUser.username;
}

function renderPlanner() {
  const container = document.getElementById('mainContent');
  if (!container) return;
  const done = currentUser.tasks.filter(t => t.completed).length;
  const pct = currentUser.tasks.length ? Math.round(done / currentUser.tasks.length * 100) : 0;
  const left = MAX_TASKS - currentUser.tasks.length;
  const name = currentUser.name || currentUser.username;

  let tasksHtml = '';
  if (currentUser.tasks.length === 0) {
    tasksHtml = `<div class="empty-state"><span class="empty-emoji">📝</span><p>Пока нет задач</p><p>Добавьте первую задачу — можно до ${MAX_TASKS} на день</p></div>`;
  } else {
    tasksHtml = `<div class="tasks-grid">` + currentUser.tasks.map(t => `
      <div class="task-card ${t.completed ? 'completed' : ''}">
        <div class="task-header">
          <input type="checkbox" class="task-check" data-id="${t.id}" ${t.completed ? 'checked' : ''}>
          <span class="task-title">${escapeHtml(t.title)}</span>
          <button class="delete-task-btn" data-id="${t.id}">✕</button>
        </div>
        <input type="text" class="task-reward-input ${t.reward?.trim() ? 'has-value' : ''}" placeholder="Моя награда за эту задачу…" value="${escapeHtml(t.reward)}" data-id="${t.id}">
      </div>`).join('') + `</div>`;
  }

  container.innerHTML = `
    <div class="container">
      <div class="page-header">
        <h2>Планер дня</h2>
        <div class="greeting">${name}, вот твои задачи на сегодня <span style="color:#FF9800;">${left > 0 ? `➕ ещё ${left} слота` : '🎯 лимит достигнут'}</span></div>
      </div>
      ${tasksHtml}
      <div class="add-task-card">
        <div class="add-task-form">
          <input type="text" id="newTaskTitle" placeholder="Новая задача…" ${left <= 0 ? 'disabled' : ''}>
          <button id="addTaskBtn" ${left <= 0 ? 'disabled' : ''}>Добавить</button>
        </div>
        <div class="task-limit-note ${left <= 0 ? 'task-limit-warn' : ''}">${left <= 0 ? 'Сегодняшний лимит исчерпан. Завтра новый день!' : `Осталось ${left} из ${MAX_TASKS} задач`}</div>
      </div>
    </div>
  `;

  container.querySelectorAll('.task-check').forEach(cb => cb.addEventListener('change', e => toggleTask(+e.target.dataset.id)));
  container.querySelectorAll('.task-reward-input').forEach(inp => inp.addEventListener('change', e => updateTaskReward(+e.target.dataset.id, e.target.value)));
  container.querySelectorAll('.delete-task-btn').forEach(btn => btn.addEventListener('click', e => deleteTask(+e.target.dataset.id)));
  const addBtn = document.getElementById('addTaskBtn'), inp = document.getElementById('newTaskTitle');
  if (addBtn && inp) addBtn.addEventListener('click', () => { addTask(inp.value); inp.value = ''; });
  updateTopBar();
}

function renderProgress() {
  const container = document.getElementById('mainContent');
  const total = currentUser.tasks.length;
  const done = currentUser.tasks.filter(t => t.completed).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const rew = currentUser.tasks.filter(t => t.reward?.trim()).length;
  const claimed = (currentUser.claimedRewards || []).length;
  container.innerHTML = `
    <div class="container">
      <div class="page-header"><h2>Твой прогресс</h2></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-number">${total}/${MAX_TASKS}</div><div class="stat-label">Задач сегодня</div></div>
        <div class="stat-card"><div class="stat-number">${done}</div><div class="stat-label">Выполнено</div></div>
        <div class="stat-card"><div class="stat-number">${pct}%</div><div class="stat-label">Эффективность</div></div>
        <div class="stat-card"><div class="stat-number">${rew}</div><div class="stat-label">Наград назначено</div></div>
        <div class="stat-card"><div class="stat-number">${claimed}</div><div class="stat-label">Наград получено</div></div>
      </div>
    </div>`;
  updateTopBar();
}

function renderRewards() {
  const container = document.getElementById('mainContent');
  const tasks = currentUser.tasks.filter(t => t.reward?.trim());
  if (!tasks.length) {
    container.innerHTML = `<div class="container"><div class="page-header"><h2>Мои награды</h2></div><div class="empty-state"><span class="empty-emoji">🎁</span><p>Пока нет наград</p><p>Добавь награду к каждой задаче в планере</p></div></div>`;
    updateTopBar();
    return;
  }
  container.innerHTML = `<div class="container"><div class="page-header"><h2>Мои награды</h2></div><div class="rewards-list">` + tasks.map(t => {
    const claimed = (currentUser.claimedRewards || []).includes(t.id);
    return `<div class="reward-item ${claimed ? 'claimed' : ''}">
      <div class="reward-task-name">${escapeHtml(t.title)}</div>
      <span class="reward-status-badge ${t.completed ? 'badge-done' : 'badge-pending'}">${t.completed ? '✓ Выполнено' : '● В процессе'}</span>
      <div class="reward-value">🎁 ${escapeHtml(t.reward)}</div>
      <label class="reward-claim-label"><input type="checkbox" class="reward-claim-check" data-id="${t.id}" ${claimed ? 'checked' : ''} ${!t.completed ? 'disabled' : ''}><span>${claimed ? 'Награда получена!' : 'Забрать награду'}</span></label>
      ${!t.completed ? '<p style="font-size:12px;color:#FF9800;margin-top:8px">Сначала выполните задачу</p>' : ''}
    </div>`;
  }).join('') + `</div></div>`;
  container.querySelectorAll('.reward-claim-check').forEach(cb => cb.addEventListener('change', e => { if (!cb.disabled) toggleRewardClaim(+e.target.dataset.id); }));
  updateTopBar();
}

const REST_TIPS = ["Подыши свежим воздухом 5 минут","Выпей чай без телефона","Сделай лёгкую растяжку","Послушай любимую музыку","Ничего не делай — это тоже отдых","Почитай книгу 15 минут","Прогуляйся вокруг дома","Сделай самомассаж лица","Посмотри на звёзды или облака","Напиши три приятных события дня"];

function renderRest() {
  const tip = REST_TIPS[Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000) % REST_TIPS.length];
  document.getElementById('mainContent').innerHTML = `<div class="container"><div class="page-header"><h2>Практика отдыха</h2></div><div class="rest-card"><div class="rest-quote">"${tip}"</div><p>Ты сделала достаточно за сегодня.<br>Отдыхай без чувства вины.</p><div style="margin-top:24px;font-size:12px;color:#6C7E8F;">Новый совет каждый день</div></div></div>`;
  updateTopBar();
}

function renderCurrentPage() {
  const active = document.querySelector('.bottom-nav-btn.active');
  const page = active?.dataset.page || 'planner';
  if (page === 'planner') renderPlanner();
  else if (page === 'progress') renderProgress();
  else if (page === 'rewards') renderRewards();
  else if (page === 'rest') renderRest();
}

// ------------------------------------------------------------
// 6. НАВИГАЦИЯ
// ------------------------------------------------------------
function setupNavigation() {
  document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCurrentPage();
    });
  });
}

// ------------------------------------------------------------
// 7. ЗАПУСК ПРИЛОЖЕНИЯ
// ------------------------------------------------------------
function startMainApp() {
  showScreen('mainApp');
  setupNavigation();
  renderCurrentPage();
  updateTopBar();
  if (Notification.permission === 'default') document.getElementById('notificationPermission').classList.remove('hidden');
  else if (Notification.permission === 'granted') scheduleNotifications();
}

// ------------------------------------------------------------
// 8. ОБРАБОТЧИКИ
// ------------------------------------------------------------
function initHandlers() {
  document.getElementById('doLoginBtn').addEventListener('click', () => {
    const u = document.getElementById('loginUsername').value;
    const p = document.getElementById('loginPassword').value;
    if (login(u, p)) afterLogin();
  });
  document.getElementById('doRegisterBtn').addEventListener('click', () => {
    const u = document.getElementById('regUsername').value;
    const e = document.getElementById('regEmail').value;
    const p = document.getElementById('regPassword').value;
    if (register(u, e, p)) {
      document.getElementById('regError').innerText = '';
      document.querySelector('.auth-tab[data-tab="login"]').click();
    }
  });
  document.getElementById('saveNameBtn').addEventListener('click', () => {
    const name = document.getElementById('userNameInput').value.trim();
    if (name) { saveUserName(name); showScreen('notificationsSetupScreen'); }
    else alert('Пожалуйста, введите имя');
  });
  document.getElementById('saveNotificationsBtn').addEventListener('click', () => {
    const m = document.getElementById('morningTime').value || '09:00';
    const e = document.getElementById('eveningTime').value || '20:00';
    saveNotificationTimes(m, e);
  });
  document.getElementById('topLogoutBtn').addEventListener('click', () => {
    currentUser = null;
    localStorage.removeItem('mind_currentUser');
    showScreen('authScreen');
  });
  document.getElementById('allowNotificationsBtn').addEventListener('click', requestNotifications);
  document.getElementById('denyNotificationsBtn').addEventListener('click', () => {
    document.getElementById('notificationPermission').classList.add('hidden');
  });
}

// ------------------------------------------------------------
// 9. СТАРТ
// ------------------------------------------------------------
function init() {
  setupAuthTabs();
  initHandlers();
  if (currentUser) afterLogin();
  else showScreen('authScreen');
}
init();
</script>
